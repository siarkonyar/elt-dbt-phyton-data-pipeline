services:
  destination_postgres:
    image: postgres:13
    ports:
      - '5434:5432'
    networks:
      - elt_network
    environment:
      POSTGRES_DB: destination_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - destination_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d destination_db']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  ingest:
    build:
      context: ./ingest
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      # One password lives in .env. Postgres above takes it as POSTGRES_PASSWORD;
      # the Python services look for DESTINATION_POSTGRES_PASSWORD, so compose
      # hands them the same value under that name. Nothing to keep in sync.
      DESTINATION_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - elt_network
    depends_on:
      destination_postgres:
        condition: service_healthy

  transform:
    build:
      context: ./transform
      dockerfile: Dockerfile
    image: elt_transform:latest
    env_file:
      - ./.env
    environment:
      DESTINATION_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - elt_network
    depends_on:
      ingest:
        condition: service_completed_successfully

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - '8501:8501'
    env_file:
      - ./.env
    environment:
      DESTINATION_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - elt_network
    depends_on:
      destination_postgres:
        condition: service_healthy

volumes:
  destination_data:

networks:
  elt_network:
    driver: bridge