name: nightly dbt build

on:
  schedule:  
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Create .env
        run: |
          cat > elt_script/.env <<EOF
          SOURCE_POSTGRES_PASSWORD=secret
          DESTINATION_POSTGRES_PASSWORD=secret
          EOF

      - name: Start the databases
        run: docker compose up -d source_postgres destination_postgres

      - name: Run the ELT script
        run: docker compose run --rm elt_script

      - name: dbt build
        run: |
          docker compose run --rm --no-deps dbt build \
            --profiles-dir /dbt \
            --project-dir /dbt

      - name: Tear down
        if: always()
        run: docker compose down -v
