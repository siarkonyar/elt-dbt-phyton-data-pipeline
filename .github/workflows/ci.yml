name: CI

# Every push, every branch. A pull request shows the same check without a
# second run, because GitHub attaches a check to the commit, not to the event.
on: push

# A new push to a branch makes the previous run pointless. Cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write          # the action creates a check run with the results
  pull-requests: write   # and comments the summary on PRs

env:
  PYTHON_VERSION: '3.11'   # matches target-version in pyproject.toml

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: >-
          pytest -m "not integration and not e2e" --cov -ra
          --junitxml=reports/unit-junit.xml

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          check_name: unit test results
          files: reports/*.xml


  integration:
    name: integration
    runs-on: ubuntu-latest
    needs: unit

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/test_db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Fail fast if the test database is unreachable
        run: |
          python - <<'PY'
          import os

          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["TEST_DATABASE_URL"])
          with engine.connect() as connection:
              connection.execute(text("SELECT 1"))
          print("test database reachable")
          PY

      - name: Run tests
        run: >-
          pytest -m "integration" --cov -ra
          --junitxml=reports/integration-junit.xml

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          check_name: integration test results
          files: reports/*.xml

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: integration
    # Four image builds plus a live pipeline. If it hangs, fail rather than
    # burn the full 6-hour default.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # docker-compose.yaml has `env_file: ./.env` and ${POSTGRES_PASSWORD},
      # so compose refuses to start without the file. The e2e overlay
      # overrides every value it holds, so only its existence matters.
      - name: Generate a .env for compose
        run: echo "POSTGRES_PASSWORD=e2e" > .env

      - name: Run tests
        run: pytest -m e2e -ra --junitxml=reports/e2e-junit.xml

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          check_name: e2e test results
          files: reports/*.xml

  lint:
    name: ruff
    runs-on: ubuntu-latest
    needs: e2e

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # requirements-dev.txt pins ruff, so CI and your laptop lint identically.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .
