name: dbt build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Create .env
        run: |
          cat > elt_script/.env <<EOF
          SOURCE_POSTGRES_PASSWORD=secret
          DESTINATION_POSTGRES_PASSWORD=secret
          EOF

      - name: Start the databases
        run: docker compose up -d source_postgres destination_postgres

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            docker compose exec -T destination_postgres pg_isready -U postgres && exit 0
            sleep 2
          done
          exit 1

      - name: Run the ELT script
        run: docker compose run --rm elt_script

      - name: dbt build
        run: |
          docker compose run --rm --no-deps dbt build \
            --profiles-dir /dbt \
            --project-dir /dbt

      - name: Tear down
        if: always()
        run: docker compose down -v