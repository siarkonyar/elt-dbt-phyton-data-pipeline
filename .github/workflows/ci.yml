name: CI

# Every push, every branch. A pull request shows the same check without a
# second run, because GitHub attaches a check to the commit, not to the event.
on: push

# A new push to a branch makes the previous run pointless. Cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'   # matches target-version in pyproject.toml

jobs:
  unit:
    name: pytest (unit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -m "not integration" --cov -ra


  integration:
    name: pytest (integration)
    runs-on: ubuntu-latest
    needs: unit

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/test_db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Fail fast if the test database is unreachable
        run: |
          python - <<'PY'
          import os

          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["TEST_DATABASE_URL"])
          with engine.connect() as connection:
              connection.execute(text("SELECT 1"))
          print("test database reachable")
          PY

      - name: Run tests
        run: pytest -m "integration" --cov -ra

  lint:
    name: ruff
    runs-on: ubuntu-latest
    needs: integration

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # requirements-dev.txt pins ruff, so CI and your laptop lint identically.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .
