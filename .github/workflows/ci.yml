name: CI

on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  PYTHON_VERSION: '3.11'

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check . --output-format=github

  # After ruff the pipeline fans out into one lane per container. Each lane is
  # service-tests.yml: that container's unit job, then its integration job. The
  # four lanes run side by side, and a lane only runs tests/<level>/<service>,
  # so the folder a test lives in decides its lane.
  #
  # These are four plain jobs rather than one matrix on purpose: the Actions
  # graph folds a matrix into a single "Matrix" box, while separate jobs each
  # get their own box, so the four lanes are visible at a glance.
  api:
    needs: lint
    uses: ./.github/workflows/service-tests.yml
    with:
      service: api

  dashboard:
    needs: lint
    uses: ./.github/workflows/service-tests.yml
    with:
      service: dashboard

  rollup:
    needs: lint
    uses: ./.github/workflows/service-tests.yml
    with:
      service: rollup

  stream:
    needs: lint
    uses: ./.github/workflows/service-tests.yml
    with:
      service: stream

  # The fan-in point: e2e starts only after all four lanes have finished
  # unit and integration.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: [api, dashboard, rollup, stream]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Generate a .env for compose
        run: echo "POSTGRES_PASSWORD=e2e" > .env

      - name: Run tests
        run: >-
          pytest -m e2e -v -rA --durations=10
          --junitxml=reports/e2e-junit.xml

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          check_name: e2e test results
          files: reports/*.xml
          report_individual_runs: true
          report_suite_logs: any

      # No coverage line here: e2e drives the real container images, so nothing
      # in this job's Python process is measured.
      - name: Test detail
        if: always()
        run: >-
          python scripts/test_summary.py reports/e2e-junit.xml e2e
          >> "$GITHUB_STEP_SUMMARY"
