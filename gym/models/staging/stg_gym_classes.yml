version: 2

models:
  - name: stg_gym_classes
    description: "row gym classes data."
    columns:
      - name: class_id
        description: "Primary key for the class."
        tests:
          - unique
          - not_null

      - name: trainer_id
        description: "secondary key for trainer"
        tests:
            - not_null
            - relationships:
                to: ref('stg_trainers')
                field: trainer_id