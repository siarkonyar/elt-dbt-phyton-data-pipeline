version: 2

models:
  - name: dim_attendance
    description: "one row for each user to see how active they have been"
    columns:
      - name: member_id
        tests:
          - unique
          - not_null

      - name: member_name
        tests:
          - not_null

      - name: engagement
        tests:
          - accepted_values:
              values: ['Never booked', 'Tried once', 'Regular']