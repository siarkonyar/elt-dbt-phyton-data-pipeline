version: 2

models:
  - name: fct_bookings
    description: "One row per booking, enriched with member, class, and trainer names."
    columns:
      - name: booking_id
        tests:
          - unique
          - not_null

      - name: member_name
        tests:
          - not_null

      - name: status
        tests:
          - accepted_values:
              values: ['Attended', 'No-show', 'Cancelled']