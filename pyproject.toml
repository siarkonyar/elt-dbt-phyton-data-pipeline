[tool.pytest.ini_options]
testpaths = ["tests"]
junit_logging = "all"
junit_log_passing_tests = true
markers = [
    "integration: needs a real Postgres; skipped when none is reachable",
    "e2e: runs the real container images under docker compose; needs Docker",
]

[tool.coverage.run]
source = ["rollup", "stream", "api", "dashboard"]
omit = [
    "stream/main.py",   # an infinite loop; covering it proves little
    "dashboard/app.py", # a Streamlit script; importing it renders a page
]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py311"
# Each service runs with its own directory on sys.path, so `from db import ...`
# means dashboard/db.py or rollup/db.py, not some package on PyPI. Without this
# ruff calls those third-party and sorts them in with sqlalchemy.
src = [".", "api", "dashboard", "rollup", "stream"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

# FastAPI declares dependencies and query rules as argument defaults - that is
# the framework's documented style, not the mutable-default bug B008 hunts for.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]